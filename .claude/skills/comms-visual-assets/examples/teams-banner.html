<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scanner update banner</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 400px; background: var(--brand-primary);
         color: var(--brand-background); font-family: var(--brand-font);
         display: flex; flex-direction: column; justify-content: center; padding: 0 72px; }
  .label { font-size: 28px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  h1 { font-size: 72px; line-height: 1.1; margin: 16px 0; }
  .when { font-size: 32px; border-top: 3px solid var(--brand-background); padding-top: 16px; }
</style>
</head>
<body>
  <div class="label">IT Bulletin</div>
  <h1>Update your scanner app</h1>
  <div class="when">Action needed by Monday, March 18, 2030</div>
</body>
</html>
